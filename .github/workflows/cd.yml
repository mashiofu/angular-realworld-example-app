name: CD

# Push-based, not GitOps (see conduit-platform/docs/design-decisions.md
# for that trade-off). Every merge to main builds once and auto-deploys
# to dev only - staging/prod are a deliberate, separate promotion step
# (promote.yml) that re-tags and re-deploys this exact image, never
# rebuilds it. Same shape as the backend's own cd.yml, now that this
# repo is containerized too (see conduit-platform/docs/design-decisions.md
# for why it moved off S3/CloudFront).

on:
  push:
    branches: [main]
  # Lets docs/DEPLOYMENT.md's step 8 (`gh workflow run cd.yml`) actually
  # work for the "code was already on GitHub before infra existed" case,
  # where the original push-triggered run failed before the `dev`
  # GitHub Environment existed and won't retry on its own.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # realworld/ is a git submodule (the shared theme CSS lives in
          # it - see angular.json's `styles` array) - actions/checkout
          # doesn't fetch submodule content by default.
          submodules: true

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    steps:
      - name: Trigger deploy in conduit-platform
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          printf '{"event_type":"frontend-deploy","client_payload":{"environment":"dev","image_tag":"%s"}}' \
            "$IMAGE_TAG" | gh api "repos/${{ vars.PLATFORM_REPO }}/dispatches" --input -
