name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bunx vitest run

      - name: Production build (proving it still builds - not deployed from here)
        run: bunx ng build --configuration production
