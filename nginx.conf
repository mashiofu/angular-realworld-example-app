server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA shell and the runtime-config file must never be cached - a
    # new deploy (new image, or just a new API_URL) needs to be visible on
    # the next reload without requiring a hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Hashed build artifacts (chunk-XXXX.js, styles-XXXX.css, ...) are safe
    # to cache aggressively - the filename itself changes whenever the
    # content does.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing: unknown paths fall back to index.html rather
    # than a 404, so deep links and refreshes on e.g. /article/some-slug
    # work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
